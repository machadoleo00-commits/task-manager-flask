<html>
    <head>
        <title>Task manager</title>
    </head>
    <body>
        {%  extends 'base.html' %}
        {% block main %}

        <h1>tasks</h1>
        <ul>
            {% for task in tasks %}
                <li>{{ task.title }} created on {{ task.date }} UTC </li>
            {% endfor %}
        </ul>

        {% endblock main %}
    </body>
</html>
